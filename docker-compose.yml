# Kempen Cricket Club — website + form APIs, single origin via nginx.
#   cp .env.sample .env      # then fill in real values (.env is gitignored)
#   docker compose up --build
#
# Open the site at  http://localhost  — nginx serves the Astro site and proxies
# /api/* to the Functions container (which listens on 8080, matching prod).
services:
  api:
    build:
      context: ./api
    image: kcc-api
    # Functions runtime image is amd64-only; runs under emulation on arm64 Macs.
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"                # reachable to nginx as http://api:8080 (not published)
    ports:
      # Optional: direct API access for debugging / Bruno at http://localhost:7071
      - "7071:8080"
    env_file:
      - .env
    healthcheck:
      # /api/token returns 401 without credentials, which still proves the app is up.
      test: ["CMD", "sh", "-c", "wget -q -O- --post-data='{}' --header='Content-Type: application/json' http://localhost:8080/api/token || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    image: kcc-web
    restart: unless-stopped
    environment:
      # Separate containers here, so reach the api by its compose service name.
      - API_UPSTREAM=api:8080
    ports:
      - "80:80"               # public entry point — open http://localhost
    depends_on:
      - api
