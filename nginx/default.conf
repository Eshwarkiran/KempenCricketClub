# Reverse proxy + static host for the Kempen Cricket Club site.
# Serves the built Astro site and forwards /api/* to the Functions container,
# so the browser sees a single origin and the forms' relative /api calls work.

upstream api_upstream {
    # "api" is the compose service name; it listens on 80 inside its container.
    server api:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API: forward to the Azure Functions container ---
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;
    }

    # --- Static site (Astro: build format 'directory', trailingSlash 'always') ---
    # Pages are emitted as /path/index.html, so try the URI, then its directory,
    # then fall back to the built 404 page.
    location / {
        try_files $uri $uri/ /404/index.html;
    }

    # Cache fingerprinted build assets aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
